// Android 工程只 include app 一个模块；代理二进制以 jniLibs/<abi>/liboc2api.so
// 形式打进 APK，源码仍属同仓 Go 工程（版本单一来源 = git tag）。
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "oc2api-android"
include(":app")
